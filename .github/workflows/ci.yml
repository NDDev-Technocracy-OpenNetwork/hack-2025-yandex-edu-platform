name: ci

# CI for rldyourmnd/hack-2025-yandex-edu-platform (public OSS).
# Python backend (FastAPI) + TypeScript frontend (Vite) + Dockerfiles (hadolint).
# Triggers: pull_request + workflow_dispatch ONLY (no push: cross-owner reusable).
# Reusable workflows are pinned to an immutable ci-workflows SHA.

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python backend (3.11)
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/python-ci.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      uv_version: "0.12.23"
      python_version: '3.11'
      working_directory: backend
      install_command: 'uv pip install -r requirements.txt ruff==0.16.8'
      test_command: "python -m ruff check . && python -m unittest discover -s tests -v"

  node:
    name: node frontend
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/node-ci.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      package_manager: npm
      node_version: "24.21.0"
      npm_version: "11.19.0"
      working_directory: frontend
      install_command: 'npm ci'
      test_command: "npm run build"

  hadolint:
    name: hadolint
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/hadolint-ci.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      recursive: true
      failure_threshold: warning
